# flake8 runs wemake-python-styleguide only (`uv run flake8 .`); Ruff stays the formatter and the base linter,
# configured in pyproject.toml.
[flake8]
select = WPS
max-line-length = 120
exclude = .git,.venv,__pycache__,.mypy_cache,.pytest_cache,.ruff_cache,build,dist
per-file-ignores =
    # AGENTS.md: one file, src/matchapi/__init__.py holds the whole framework. WPS412 wants no logic in an
    # `__init__.py` and WPS202 at most 7 functions and classes in a module: both mean splitting the core.
    src/matchapi/__init__.py: WPS202, WPS412
    # Tests: status codes and expected bodies are literals (WPS432, WPS226), a test asserts what it checks
    # (WPS218), and AGENTS.md keeps the suite in this one file (WPS201 imports, WPS202 module members).
    tests/test_matchapi.py: WPS201, WPS202, WPS218, WPS226, WPS432
    # AGENTS.md: tests/sample.py is the README's app.py byte for byte, and bench/service.py the same service:
    # `handle` is the name the README and `granian app:handle` give the handler (WPS110), 201 and 404 are the
    # statuses the example returns (WPS432).
    tests/sample.py: WPS110, WPS432
    bench/service.py: WPS110, WPS432

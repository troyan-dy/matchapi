[project]
name = "matchapi"
version = "0.1.0"
description = "An HTTP service is one function: match replaces the router"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitriy Troyan" }]
requires-python = ">=3.11"
dependencies = [
  "uvicorn>=0.30",
]
keywords = ["http", "asgi", "web", "framework", "match", "pattern-matching", "microservice", "webhook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/troyan-dy/matchapi"
Repository = "https://github.com/troyan-dy/matchapi"
Issues = "https://github.com/troyan-dy/matchapi/issues"
Changelog = "https://github.com/troyan-dy/matchapi/blob/master/CHANGELOG.md"

[project.scripts]
matchapi = "matchapi:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/matchapi"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "A", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# The app of the README, verbatim: it imports nothing and has no annotations
module = "sample"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["matchapi"]
branch = true
# `python -m matchapi` runs in the subprocess of tests/test_matchapi.py::test_the_command_serves_over_http
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100

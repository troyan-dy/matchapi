[project]
name = "matchapi"
version = "0.3.1"
description = "One-function HTTP framework for granian over RSGI: match replaces the router"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitriy Troyan" }]
requires-python = ">=3.11"
dependencies = [
  "granian>=2.8",
]
keywords = [
  "http",
  "rsgi",
  "granian",
  "web",
  "framework",
  "web-framework",
  "microframework",
  "async",
  "asyncio",
  "api",
  "rest",
  "json",
  "match",
  "pattern-matching",
  "structural-pattern-matching",
  "microservice",
  "webhook",
  "single-file",
  "rust",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/troyan-dy/matchapi"
Repository = "https://github.com/troyan-dy/matchapi"
Issues = "https://github.com/troyan-dy/matchapi/issues"
Changelog = "https://github.com/troyan-dy/matchapi/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=2.4",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "ruff>=0.17",
  "wemake-python-styleguide>=1.8.1",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "bench", "CHANGELOG.md", "CONTEXT.md", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/matchapi"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "A", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]
external = ["WPS"]  # wemake-python-styleguide's codes, checked by flake8 (setup.cfg)

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# The app of the README, verbatim: it has no annotations
module = "sample"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["matchapi"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
